name: CI

# PR gate for bucket-broker. Every job reports a status so it can be made a
# required check via a branch-protection ruleset (see docs/ci.md). Jobs no-op
# cleanly while a given layer (Terraform / Rego / Node) does not exist yet, and
# start enforcing automatically as those files land.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default. No job here needs write or id-token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TFSEC_VERSION: "1.28.14"
  OPA_VERSION: "1.18.2"
  GITLEAKS_VERSION: "8.30.1"
  CHECKOV_VERSION: "3.3.6"
  TERRAFORM_VERSION: "1.9.8"
  NODE_VERSION: "20"

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan working tree + history
        run: gitleaks detect --source . --redact --no-banner --verbose

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive -diff
      - name: terraform validate (every module/root)
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No Terraform found yet — nothing to validate."
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done

  tf-security:
    name: Terraform security (tfsec + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Any Terraform present?
        id: detect
        run: |
          if find . -name '*.tf' -not -path '*/.terraform/*' | grep -q .; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform yet — scanners will report clean."
          fi
      - name: Install tfsec
        if: steps.detect.outputs.tf == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec-linux-amd64" -o "$HOME/.local/bin/tfsec"
          chmod +x "$HOME/.local/bin/tfsec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: tfsec
        if: steps.detect.outputs.tf == 'true'
        run: tfsec . --no-color --soft-fail=false
      - name: Install checkov
        if: steps.detect.outputs.tf == 'true'
        run: pipx install "checkov==${CHECKOV_VERSION}"
      - name: checkov
        if: steps.detect.outputs.tf == 'true'
        run: checkov -d . --framework terraform --compact --quiet

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Any Rego present?
        id: detect
        run: |
          if find . -name '*.rego' | grep -q .; then
            echo "rego=true" >> "$GITHUB_OUTPUT"
          else
            echo "rego=false" >> "$GITHUB_OUTPUT"
            echo "No Rego policy yet — nothing to test."
          fi
      - name: Install opa
        if: steps.detect.outputs.rego == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" -o "$HOME/.local/bin/opa"
          chmod +x "$HOME/.local/bin/opa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: opa fmt (check) + test
        if: steps.detect.outputs.rego == 'true'
        run: |
          opa fmt --list --fail .
          opa test . -v

  node:
    name: Node lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: package.json present?
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — nothing to build."
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        if: steps.detect.outputs.node == 'true'
        run: npm ci
      - name: Lint / typecheck / test
        if: steps.detect.outputs.node == 'true'
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
