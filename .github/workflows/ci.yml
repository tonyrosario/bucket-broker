name: CI

# PR gate for bucket-broker. Every job reports a status so it can be made a
# required check via a branch-protection ruleset (see docs/ci.md). Jobs no-op
# cleanly while a given layer (Terraform / Rego / Node) does not exist yet, and
# start enforcing automatically as those files land.

on:
  # SECURITY: keep this as `pull_request` — never `pull_request_target`. The
  # node and policy jobs execute PR-authored code (npm test/lint, opa test) on
  # the runner. Under `pull_request` that runs with a read-only GITHUB_TOKEN and
  # no secrets; under `pull_request_target` the same steps would run in the base
  # repo's privileged context (write scope + secrets) — a classic pwn-request.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only by default. No job here needs write or id-token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TFSEC_VERSION: "1.28.14"
  OPA_VERSION: "1.18.2"
  GITLEAKS_VERSION: "8.30.1"
  CHECKOV_VERSION: "3.3.6"
  TERRAFORM_VERSION: "1.9.8"
  NODE_VERSION: "20"

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"; cd "$tmp"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan working tree + history
        run: gitleaks detect --source . --redact --no-banner --verbose

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive -diff
      - name: terraform validate (every module/root)
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No Terraform found yet — nothing to validate."
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done

  tf-security:
    name: Terraform security (tfsec + checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Any Terraform present?
        id: detect
        run: |
          if find . -name '*.tf' -not -path '*/.terraform/*' | grep -q .; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform yet — scanners will report clean."
          fi
      - name: Install tfsec (checksum-verified)
        if: steps.detect.outputs.tf == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"; cd "$tmp"
          base="https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}"
          curl -sSfL "${base}/tfsec_${TFSEC_VERSION}_checksums.txt" -o checksums.txt
          curl -sSfL "${base}/tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz" -o "tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz"
          grep "tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz" tfsec
          install -m 0755 tfsec "$HOME/.local/bin/tfsec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: tfsec
        if: steps.detect.outputs.tf == 'true'
        run: tfsec . --no-color --soft-fail=false
      - name: Install checkov
        if: steps.detect.outputs.tf == 'true'
        run: pipx install "checkov==${CHECKOV_VERSION}"
      - name: checkov
        if: steps.detect.outputs.tf == 'true'
        run: checkov -d . --framework terraform --compact --quiet

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    # Bound compute: this job runs `opa test` over PR-authored Rego dirs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Any Rego present?
        id: detect
        run: |
          if find . -name '*.rego' -not -path '*/node_modules/*' | grep -q .; then
            echo "rego=true" >> "$GITHUB_OUTPUT"
          else
            echo "rego=false" >> "$GITHUB_OUTPUT"
            echo "No Rego policy yet — nothing to test."
          fi
      - name: Install opa (checksum-verified)
        if: steps.detect.outputs.rego == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"; cd "$tmp"
          base="https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}"
          curl -sSfL "${base}/opa_linux_amd64_static" -o opa
          curl -sSfL "${base}/opa_linux_amd64_static.sha256" -o opa.sha256
          echo "$(awk '{print $1}' opa.sha256)  opa" | sha256sum -c -
          install -m 0755 opa "$HOME/.local/bin/opa"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: opa fmt (check) + test
        if: steps.detect.outputs.rego == 'true'
        run: |
          set -euo pipefail
          # Scope OPA to the directories that actually contain Rego. Running over
          # the repo root (`.`) makes OPA load every *.json/*.yaml file as a data
          # document, and unrelated files (e.g. .github/workflows/*.yml,
          # */package.json) collide with "merge error". Passing the Rego dirs
          # together still allows cross-package data references between policies.
          mapfile -t dirs < <(find . -type f -name '*.rego' -not -path '*/node_modules/*' -exec dirname {} \; | sort -u)
          echo "Rego dirs: ${dirs[*]}"
          opa fmt --list --fail "${dirs[@]}"
          opa test "${dirs[@]}" -v

  node:
    name: Node lint + typecheck + test
    runs-on: ubuntu-latest
    # Bound compute: this job installs and runs PR-authored test/lint scripts
    # for every discovered package.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Discover Node packages
        id: detect
        run: |
          set -euo pipefail
          # The project is intentionally multi-package (src/skeleton, src/lib/*),
          # each self-contained per AGENTS.md — there is no root package.json.
          # Discover every package (excluding node_modules) and gate on each,
          # mirroring how the terraform job iterates modules.
          mapfile -t dirs < <(find . -type f -name package.json -not -path '*/node_modules/*' -exec dirname {} \; | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — nothing to build."
          else
            echo "node=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${dirs[@]}" > "$RUNNER_TEMP/node-dirs.txt"
            echo "Node packages:"; cat "$RUNNER_TEMP/node-dirs.txt"
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Lint / typecheck / test (each package)
        if: steps.detect.outputs.node == 'true'
        # --ignore-scripts: do not execute PR-authored lifecycle hooks
        # (preinstall/postinstall) on untrusted fork input.
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "::group::node ${dir}"
            (
              cd "${dir}"
              # Require a committed lockfile so the whole dependency tree is
              # integrity-pinned via `npm ci`; fail rather than fall back to an
              # unpinned `npm install` that resolves semver ranges fresh.
              if [ ! -f package-lock.json ]; then
                echo "::error::${dir} has no package-lock.json — commit one so npm ci can integrity-pin dependencies."
                exit 1
              fi
              npm ci --ignore-scripts
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present
            )
            echo "::endgroup::"
          done < "$RUNNER_TEMP/node-dirs.txt"
